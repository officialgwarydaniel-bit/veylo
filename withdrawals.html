<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0d0f"
  >

  <title>Veylo — Admin Withdrawals</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {
      --bg: #0b0d0f;
      --surface: #14171a;
      --surface2: #191c20;
      --line: #292d31;
      --text: #f4f4f2;
      --muted: #9a9da0;
      --accent: #35d1ad;
      --accent2: #ffae32;
      --danger: #ff6868;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    body {
      padding-bottom: 50px;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: min(100%, 950px);
      margin: auto;
      padding: 20px 16px 70px;
    }

    /* HEADER */

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .admin-badge {
      border: 1px solid rgba(53, 209, 173, .3);
      background: rgba(53, 209, 173, .08);
      color: #b9eee2;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .7px;
    }

    /* TITLE */

    .title {
      margin-bottom: 20px;
    }

    .title h1 {
      margin: 0 0 7px;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    /* STATUS */

    .status {
      display: none;
      border-radius: 17px;
      padding: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
      font-size: 13px;
    }

    .status.success {
      display: block;
      background: rgba(53, 209, 173, .10);
      border: 1px solid rgba(53, 209, 173, .30);
      color: #b9eee2;
    }

    .status.error {
      display: block;
      background: rgba(255, 104, 104, .10);
      border: 1px solid rgba(255, 104, 104, .30);
      color: #ffb3b3;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 17px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .summary-value {
      margin-top: 8px;
      font-size: 25px;
      font-weight: 850;
    }

    /* TOOLBAR */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter {
      height: 44px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .refresh {
      height: 44px;
      padding: 0 15px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-weight: 750;
    }

    .refresh:active {
      transform: scale(.98);
    }

    /* REQUEST CARD */

    .requests {
      display: grid;
      gap: 12px;
    }

    .request {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 23px;
      padding: 18px;
    }

    .request-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 16px;
    }

    .request-amount {
      font-size: 26px;
      font-weight: 850;
    }

    .request-method {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      flex-shrink: 0;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .badge.pending {
      background: rgba(255, 174, 50, .12);
      color: #ffc56b;
      border: 1px solid rgba(255, 174, 50, .25);
    }

    .badge.approved {
      background: rgba(53, 209, 173, .12);
      color: #8ee6d2;
      border: 1px solid rgba(53, 209, 173, .25);
    }

    .badge.completed {
      background: rgba(53, 209, 173, .12);
      color: #8ee6d2;
      border: 1px solid rgba(53, 209, 173, .25);
    }

    .badge.rejected {
      background: rgba(255, 104, 104, .12);
      color: #ffaaaa;
      border: 1px solid rgba(255, 104, 104, .25);
    }

    .details {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .detail {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      padding: 7px 0;
      font-size: 12px;
    }

    .detail-label {
      color: var(--muted);
      font-weight: 700;
    }

    .detail-value {
      word-break: break-word;
      font-weight: 650;
    }

    .destination {
      margin-top: 12px;
      padding: 13px;
      border-radius: 15px;
      background: var(--surface2);
      border: 1px solid var(--line);
    }

    .destination-title {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    .destination-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 5px 0;
      font-size: 12px;
    }

    .destination-key {
      color: var(--muted);
    }

    .destination-value {
      text-align: right;
      word-break: break-word;
      font-weight: 700;
    }

    /* ACTIONS */

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .action {
      min-height: 45px;
      border-radius: 13px;
      font-weight: 800;
      border: 1px solid var(--line);
      background: var(--surface2);
      color: var(--text);
    }

    .action.approve {
      border-color: rgba(53, 209, 173, .3);
      color: #8ee6d2;
    }

    .action.reject {
      border-color: rgba(255, 104, 104, .3);
      color: #ffaaaa;
    }

    .action.complete {
      border-color: rgba(53, 209, 173, .3);
      color: #8ee6d2;
    }

    .action:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .action:active:not(:disabled) {
      transform: scale(.98);
    }

    /* EMPTY */

    .empty {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }

    /* LOADING */

    .loading {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .summary {
        grid-template-columns: 1fr;
      }

      .summary-card {
        padding: 14px;
      }

      .detail {
        grid-template-columns: 105px 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .filter {
        flex: 1;
      }

    }

  </style>

</head>


<body>


<div class="wrap">


  <header class="top">

    <div class="brand">
      veylo
    </div>

    <div class="admin-badge">
      ADMIN
    </div>

  </header>


  <section class="title">

    <h1>
      Withdrawal requests
    </h1>

    <p>
      Review and manage customer withdrawal requests.
    </p>

  </section>


  <div
    class="status"
    id="status"
  ></div>


  <section class="summary">

    <div class="summary-card">

      <div class="summary-label">
        PENDING
      </div>

      <div
        class="summary-value"
        id="pendingCount"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        APPROVED
      </div>

      <div
        class="summary-value"
        id="approvedCount"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        COMPLETED
      </div>

      <div
        class="summary-value"
        id="completedCount"
      >
        0
      </div>

    </div>

  </section>


  <div class="toolbar">

    <select
      class="filter"
      id="statusFilter"
    >

      <option value="all">
        All requests
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="approved">
        Approved
      </option>

      <option value="completed">
        Completed
      </option>

      <option value="rejected">
        Rejected
      </option>

    </select>


    <button
      class="refresh"
      id="refresh"
      type="button"
    >
      ↻ Refresh
    </button>

  </div>


  <div
    class="requests"
    id="requests"
  >

    <div class="loading">
      Loading withdrawal requests…
    </div>

  </div>


</div>



<script>

(async () => {


  let sb = null;

  let allRequests = [];


  const statusElement =
    document.getElementById(
      "status"
    );


  const requestsElement =
    document.getElementById(
      "requests"
    );


  const statusFilter =
    document.getElementById(
      "statusFilter"
    );


  /*
    SHOW STATUS
  */

  function showStatus(
    message,
    type
  ) {

    statusElement.textContent =
      message;

    statusElement.className =
      "status " + type;

  }


  /*
    CLEAR STATUS
  */

  function clearStatus() {

    statusElement.textContent =
      "";

    statusElement.className =
      "status";

  }


  /*
    ESCAPE HTML
  */

  function escapeHTML(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
    FORMAT MONEY
  */

  function formatMoney(
    amount
  ) {

    return "$" +
      Number(
        amount || 0
      ).toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

  }


  /*
    FORMAT DATE
  */

  function formatDate(
    value
  ) {

    if (!value) {
      return "Unknown";
    }


    const date =
      new Date(
        value
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "Unknown";

    }


    return date.toLocaleString(
      "en-US",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  }


  /*
    FORMAT DESTINATION
  */

  function destinationHTML(
    destination
  ) {

    if (
      !destination ||
      typeof destination !== "object"
    ) {

      return `
        <div class="destination">
          <div class="destination-title">
            DESTINATION
          </div>
          <div class="destination-value">
            No destination details
          </div>
        </div>
      `;

    }


    const entries =
      Object.entries(
        destination
      );


    if (
      entries.length === 0
    ) {

      return `
        <div class="destination">
          <div class="destination-title">
            DESTINATION
          </div>
          <div class="destination-value">
            No destination details
          </div>
        </div>
      `;

    }


    return `

      <div class="destination">

        <div class="destination-title">
          DESTINATION DETAILS
        </div>

        ${
          entries
            .map(
              ([key, value]) => `

                <div class="destination-row">

                  <span class="destination-key">
                    ${escapeHTML(
                      key
                    )}
                  </span>

                  <span class="destination-value">
                    ${escapeHTML(
                      value
                    )}
                  </span>

                </div>

              `
            )
            .join("")
        }

      </div>

    `;

  }


  /*
    REQUEST HTML
  */

  function requestHTML(
    request
  ) {

    const status =
      String(
        request.status || "pending"
      ).toLowerCase();


    const userId =
      request.user_id ||
      "Unknown";


    const pending =
      status === "pending";


    const approved =
      status === "approved";


    return `

      <article
        class="request"
        data-id="${escapeHTML(
          request.id
        )}"
      >

        <div class="request-top">

          <div>

            <div class="request-amount">
              ${formatMoney(
                request.amount
              )}
            </div>

            <div class="request-method">
              ${escapeHTML(
                request.method
              )}
            </div>

          </div>


          <div
            class="badge ${escapeHTML(
              status
            )}"
          >
            ${escapeHTML(
              status
            )}
          </div>

        </div>


        <div class="details">

          <div class="detail">

            <div class="detail-label">
              Request ID
            </div>

            <div class="detail-value">
              ${escapeHTML(
                request.id
              )}
            </div>

          </div>


          <div class="detail">

            <div class="detail-label">
              User ID
            </div>

            <div class="detail-value">
              ${escapeHTML(
                userId
              )}
            </div>

          </div>


          <div class="detail">

            <div class="detail-label">
              Requested
            </div>

            <div class="detail-value">
              ${formatDate(
                request.created_at
              )}
            </div>

          </div>


          ${destinationHTML(
            request.destination
          )}

        </div>


        <div class="actions">

          <button
            class="action approve"
            data-status="approved"
            data-id="${escapeHTML(
              request.id
            )}"
            type="button"
            ${!pending ? "disabled" : ""}
          >
            Approve
          </button>


          <button
            class="action reject"
            data-status="rejected"
            data-id="${escapeHTML(
              request.id
            )}"
            type="button"
            ${!pending ? "disabled" : ""}
          >
            Reject
          </button>


          <button
            class="action complete"
            data-status="completed"
            data-id="${escapeHTML(
              request.id
            )}"
            type="button"
            ${!approved ? "disabled" : ""}
          >
            Complete
          </button>

        </div>

      </article>

    `;

  }


  /*
    UPDATE COUNTERS
  */

  function updateCounters() {

    const pending =
      allRequests.filter(
        item =>
          item.status === "pending"
      ).length;


    const approved =
      allRequests.filter(
        item =>
          item.status === "approved"
      ).length;


    const completed =
      allRequests.filter(
        item =>
          item.status === "completed"
      ).length;


    document.getElementById(
      "pendingCount"
    ).textContent =
      pending;


    document.getElementById(
      "approvedCount"
    ).textContent =
      approved;


    document.getElementById(
      "completedCount"
    ).textContent =
      completed;

  }


  /*
    RENDER REQUESTS
  */

  function renderRequests() {

    const filter =
      statusFilter.value;


    let requests =
      allRequests;


    if (
      filter !== "all"
    ) {

      requests =
        allRequests.filter(
          item =>
            item.status === filter
        );

    }


    if (
      requests.length === 0
    ) {

      requestsElement.innerHTML = `

        <div class="empty">

          No withdrawal requests
          match this filter.

        </div>

      `;

      return;

    }


    requestsElement.innerHTML =
      requests
        .map(
          requestHTML
        )
        .join("");

  }


  /*
    LOAD CONFIG
  */

  try {


    const txt =
      await fetch(
        "supabase-config.js",
        {
          cache: "no-store"
        }
      )
      .then(
        response =>
          response.text()
      );


    const url =
      (
        txt.match(
          /SUPABASE_URL\s*=\s*["']([^"']+)["']/
        ) || []
      )[1];


    const key =
      (
        txt.match(
          /SUPABASE_PUBLISHABLE_KEY\s*=\s*["']([^"']+)["']/
        ) || []
      )[1];


    if (
      !url ||
      !key
    ) {

      showStatus(
        "Veylo Supabase configuration could not be loaded.",
        "error"
      );

      return;

    }


    /*
      CREATE CLIENT
    */

    sb =
      window.supabase.createClient(
        url,
        key
      );


    /*
      CHECK AUTH
    */

    const {
      data: {
        user
      },
      error: userError
    } =
      await sb.auth.getUser();


    if (
      userError ||
      !user
    ) {

      location.href =
        "login.html";

      return;

    }


    /*
      ADMIN EMAIL CHECK
    */

    if (
      String(
        user.email || ""
      ).toLowerCase()
      !==
      "officialdanielgwary@gmail.com"
    ) {

      document.body.innerHTML = `

        <div
          style="
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:25px;
            background:#0b0d0f;
            color:#f4f4f2;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            text-align:center;
          "
        >

          <div>

            <div
              style="
                font-size:55px;
                margin-bottom:15px;
              "
            >
              🔒
            </div>

            <h1>
              Access denied
            </h1>

            <p
              style="
                color:#9a9da0;
                line-height:1.5;
              "
            >
              This page is restricted to
              the Veylo administrator.
            </p>

            <button
              onclick="location.href='dashboard.html'"
              style="
                margin-top:15px;
                padding:13px 18px;
                border:0;
                border-radius:14px;
                background:#35d1ad;
                color:#06120f;
                font-weight:800;
                cursor:pointer;
              "
            >
              Back to dashboard
            </button>

          </div>

        </div>

      `;

      return;

    }


    /*
      LOAD WITHDRAWALS
    */

    async function loadWithdrawals() {

      requestsElement.innerHTML = `

        <div class="loading">
          Loading withdrawal requests…
        </div>

      `;


      clearStatus();


      const result =
        await sb
          .from("withdrawal_requests")
          .select(
            "id,user_id,amount,method,destination,status,created_at"
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (
        result.error
      ) {

        console.error(
          "Withdrawal loading error:",
          result.error
        );

        showStatus(
          "Unable to load withdrawal requests: " +
          result.error.message,
          "error"
        );

        requestsElement.innerHTML = `

          <div class="empty">
            Unable to load withdrawal requests.
          </div>

        `;

        return;

      }


      allRequests =
        result.data || [];


      updateCounters();

      renderRequests();

    }


    await loadWithdrawals();



    /*
      FILTER
    */

    statusFilter.onchange =
      () => {

        renderRequests();

      };



    /*
      REFRESH
    */

    document.getElementById(
      "refresh"
    ).onclick =
      async () => {

        await loadWithdrawals();

      };



    /*
      STATUS ACTION
    */

    requestsElement.addEventListener(
      "click",
      async event => {


        const button =
          event.target.closest(
            "[data-status]"
          );


        if (!button) {
          return;
        }


        const requestId =
          button.dataset.id;


        const newStatus =
          button.dataset.status;


        if (
          !requestId ||
          !newStatus
        ) {

          return;

        }


        const labels = {

          approved:
            "Approve this withdrawal?",

          rejected:
            "Reject this withdrawal?",

          completed:
            "Mark this withdrawal as completed?"

        };


        const confirmed =
          window.confirm(
            labels[newStatus] ||
            "Change withdrawal status?"
          );


        if (!confirmed) {
          return;
        }


        button.disabled =
          true;


        const originalText =
          button.textContent;


        button.textContent =
          "Updating…";


        clearStatus();


        try {


          /*
            CALL THE SECURE DATABASE FUNCTION

            Supabase RPC is used to call the
            Postgres function we created.
          */

          const result =
            await sb.rpc(
              "admin_update_withdrawal_status",
              {
                p_id:
                  requestId,

                p_status:
                  newStatus

              }
            );


          if (
            result.error
          ) {

            throw result.error;

          }


          if (
            result.data !== true
          ) {

            throw new Error(
              "Withdrawal request was not found."
            );

          }


          showStatus(
            "Withdrawal status updated to " +
            newStatus +
            ".",
            "success"
          );


          /*
            Reload the list so the UI
            reflects the database.
          */

          await loadWithdrawals();


        } catch (error) {


          console.error(
            "Status update error:",
            error
          );


          showStatus(
            "Could not update withdrawal: " +
            (
              error.message ||
              "Unknown error"
            ),
            "error"
          );


          button.disabled =
            false;


          button.textContent =
            originalText;

        }

      }
    );


  } catch (error) {


    console.error(
      "Veylo admin error:",
      error
    );


    showStatus(
      "Something went wrong loading the admin page: " +
      (
        error.message ||
        "Unknown error"
      ),
      "error"
    );

  }


})();

</script>


</body>

</html>
