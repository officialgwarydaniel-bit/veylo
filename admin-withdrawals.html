<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0d0f"
  >

  <title>Veylo — Admin Withdrawals</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    :root {

      --bg: #0b0d0f;
      --surface: #14171a;
      --surface2: #191c20;
      --line: #292d31;
      --text: #f4f4f2;
      --muted: #9a9da0;

      --accent: #35d1ad;
      --accent2: #ffae32;
      --danger: #ff6868;

    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      background:
        var(--bg);

      color:
        var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    }


    body {

      padding-bottom: 50px;

    }


    button {

      font: inherit;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    .wrap {

      width:
        min(100%, 900px);

      margin:
        auto;

      padding:
        18px
        16px
        70px;

    }


    /* HEADER */

    .top {

      display:
        flex;

      align-items:
        center;

      gap:
        14px;

      margin-bottom:
        25px;

    }


    .back {

      width:
        44px;

      height:
        44px;

      border:
        1px solid
        var(--line);

      border-radius:
        15px;

      background:
        var(--surface);

      color:
        var(--text);

      font-size:
        22px;

    }


    .brand {

      font-size:
        27px;

      font-weight:
        850;

      letter-spacing:
        -1px;

    }


    /* TITLE */

    h1 {

      margin:
        0 0 7px;

      font-size:
        30px;

      letter-spacing:
        -1px;

    }


    .subtitle {

      color:
        var(--muted);

      margin:
        0 0 25px;

      line-height:
        1.5;

    }


    /* STATUS */

    .status {

      display:
        none;

      padding:
        14px 16px;

      border-radius:
        16px;

      margin-bottom:
        16px;

      font-size:
        13px;

      line-height:
        1.5;

    }


    .status.success {

      display:
        block;

      background:
        rgba(
          53,
          209,
          173,
          .10
        );

      border:
        1px solid
        rgba(
          53,
          209,
          173,
          .30
        );

      color:
        #b9eee2;

    }


    .status.error {

      display:
        block;

      background:
        rgba(
          255,
          104,
          104,
          .10
        );

      border:
        1px solid
        rgba(
          255,
          104,
          104,
          .30
        );

      color:
        #ffb3b3;

    }


    /* REQUEST CARD */

    .request {

      background:
        var(--surface);

      border:
        1px solid
        var(--line);

      border-radius:
        22px;

      margin-bottom:
        14px;

      overflow:
        hidden;

    }


    .request-head {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        12px;

      padding:
        17px;

      border-bottom:
        1px solid
        var(--line);

    }


    .request-title {

      font-weight:
        800;

    }


    .request-date {

      margin-top:
        4px;

      color:
        var(--muted);

      font-size:
        12px;

    }


    .badge {

      padding:
        7px 10px;

      border-radius:
        999px;

      background:
        rgba(
          255,
          174,
          50,
          .10
        );

      border:
        1px solid
        rgba(
          255,
          174,
          50,
          .25
        );

      color:
        var(--accent2);

      font-size:
        11px;

      font-weight:
        800;

      text-transform:
        uppercase;

    }


    .request-body {

      padding:
        17px;

    }


    .amount {

      font-size:
        29px;

      font-weight:
        850;

      margin-bottom:
        16px;

    }


    .details {

      display:
        grid;

      gap:
        10px;

    }


    .detail {

      background:
        var(--surface2);

      border:
        1px solid
        var(--line);

      border-radius:
        14px;

      padding:
        12px;

    }


    .detail-label {

      color:
        var(--muted);

      font-size:
        11px;

      font-weight:
        800;

      text-transform:
        uppercase;

      letter-spacing:
        .7px;

      margin-bottom:
        5px;

    }


    .detail-value {

      word-break:
        break-word;

      font-size:
        13px;

      line-height:
        1.5;

    }


    .destination {

      margin-top:
        12px;

    }


    .destination pre {

      white-space:
        pre-wrap;

      word-break:
        break-word;

      margin:
        0;

      font-family:
        inherit;

      font-size:
        12px;

      line-height:
        1.5;

      color:
        var(--text);

    }


    /* BUTTONS */

    .actions {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      margin-top:
        17px;

    }


    .approve,
    .reject {

      height:
        50px;

      border-radius:
        15px;

      font-weight:
        800;

    }


    .approve {

      border:
        1px solid
        var(--accent);

      background:
        var(--accent);

      color:
        #06120f;

    }


    .reject {

      border:
        1px solid
        rgba(
          255,
          104,
          104,
          .35
        );

      background:
        rgba(
          255,
          104,
          104,
          .08
        );

      color:
        #ffb3b3;

    }


    .empty {

      background:
        var(--surface);

      border:
        1px solid
        var(--line);

      border-radius:
        22px;

      padding:
        35px 20px;

      text-align:
        center;

      color:
        var(--muted);

    }


    .loading {

      text-align:
        center;

      color:
        var(--muted);

      padding:
        30px;

    }


    @media (
      max-width: 500px
    ) {

      h1 {

        font-size:
          27px;

      }

      .actions {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>


<body>


<div class="wrap">


  <!-- HEADER -->

  <header class="top">

    <button
      class="back"
      id="back"
      type="button"
    >
      ←
    </button>

    <div class="brand">
      veylo
    </div>

  </header>


  <h1>
    Withdrawal Requests
  </h1>


  <p class="subtitle">
    Admin review panel. Review pending withdrawal
    requests and approve or reject them.
  </p>


  <div
    class="status"
    id="status"
  ></div>


  <div
    id="requests"
    class="loading"
  >
    Loading withdrawal requests…
  </div>


</div>



<script>


(async () => {


  let sb = null;

  let currentUser = null;


  const status =
    document.getElementById(
      "status"
    );


  const requests =
    document.getElementById(
      "requests"
    );


  /*
    STATUS
  */

  function showStatus(
    message,
    type
  ) {

    status.textContent =
      message;

    status.className =
      "status " + type;

  }


  /*
    LOAD SUPABASE CONFIG
  */

  try {


    const txt =
      await fetch(
        "supabase-config.js",
        {
          cache: "no-store"
        }
      )
      .then(
        response =>
          response.text()
      );


    const url =
      (
        txt.match(
          /SUPABASE_URL\s*=\s*["']([^"']+)["']/
        ) || []
      )[1];


    const key =
      (
        txt.match(
          /SUPABASE_PUBLISHABLE_KEY\s*=\s*["']([^"']+)["']/
        ) || []
      )[1];


    if (
      !url ||
      !key
    ) {

      throw new Error(
        "Supabase configuration not found."
      );

    }


    sb =
      window.supabase.createClient(
        url,
        key
      );


    /*
      CHECK LOGIN
    */

    const {
      data: {
        user
      },
      error: userError
    } =
      await sb.auth.getUser();


    if (
      userError ||
      !user
    ) {

      location.href =
        "login.html";

      return;

    }


    currentUser =
      user;


    /*
      CHECK ADMIN
    */

    const {
      data: isAdmin,
      error: adminError
    } =
      await sb.rpc(
        "is_admin"
      );


    if (
      adminError
    ) {

      console.error(
        "Admin check error:",
        adminError
      );

      throw new Error(
        "Unable to verify administrator access."
      );

    }


    if (
      isAdmin !== true
    ) {

      requests.className =
        "empty";

      requests.textContent =
        "Access denied. Administrator access is required.";

      return;

    }


    /*
      BACK
    */

    document.getElementById(
      "back"
    ).onclick =
      () => {

        location.href =
          "dashboard.html";

      };


    /*
      FORMAT DATE
    */

    function formatDate(
      value
    ) {

      if (!value) {
        return "Unknown date";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "Unknown date";

      }


      return date.toLocaleString(
        "en-US",
        {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    /*
      FORMAT MONEY
    */

    function money(
      value
    ) {

      return "$" +
        Number(
          value || 0
        ).toLocaleString(
          "en-US",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

    }


    /*
      ESCAPE HTML
    */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
      DESTINATION
    */

    function destinationHTML(
      destination
    ) {

      if (
        !destination
      ) {

        return "No destination information";

      }


      try {

        return escapeHTML(
          JSON.stringify(
            destination,
            null,
            2
          )
        );

      } catch {

        return "Destination information unavailable";

      }

    }


    /*
      LOAD REQUESTS
    */

    async function loadRequests() {


      requests.className =
        "loading";

      requests.textContent =
        "Loading withdrawal requests…";


      const result =
        await sb
          .from(
            "withdrawal_requests"
          )
          .select(
            "id,user_id,amount,method,destination,status,created_at"
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (
        result.error
      ) {

        throw result.error;

      }


      const rows =
        result.data || [];


      if (
        rows.length === 0
      ) {

        requests.className =
          "empty";

        requests.textContent =
          "There are no withdrawal requests.";

        return;

      }


      requests.className =
        "";


      requests.innerHTML =
        rows
          .map(
            request => {


              const pending =
                String(
                  request.status
                ).toLowerCase() ===
                "pending";


              return `

                <article
                  class="request"
                  data-id="${escapeHTML(
                    request.id
                  )}"
                >

                  <div class="request-head">

                    <div>

                      <div class="request-title">
                        Withdrawal Request
                      </div>

                      <div class="request-date">
                        ${escapeHTML(
                          formatDate(
                            request.created_at
                          )
                        )}
                      </div>

                    </div>

                    <div class="badge">
                      ${escapeHTML(
                        request.status
                      )}
                    </div>

                  </div>


                  <div class="request-body">

                    <div class="amount">
                      ${money(
                        request.amount
                      )}
                    </div>


                    <div class="details">

                      <div class="detail">

                        <div class="detail-label">
                          User ID
                        </div>

                        <div class="detail-value">
                          ${escapeHTML(
                            request.user_id
                          )}
                        </div>

                      </div>


                      <div class="detail">

                        <div class="detail-label">
                          Withdrawal Method
                        </div>

                        <div class="detail-value">
                          ${escapeHTML(
                            request.method
                          )}
                        </div>

                      </div>


                      <div class="detail destination">

                        <div class="detail-label">
                          Destination
                        </div>

                        <pre>${destinationHTML(
                          request.destination
                        )}</pre>

                      </div>

                    </div>


                    ${
                      pending
                        ? `

                          <div class="actions">

                            <button
                              class="approve"
                              data-status="approved"
                              data-id="${escapeHTML(
                                request.id
                              )}"
                              type="button"
                            >
                              Approve
                            </button>


                            <button
                              class="reject"
                              data-status="rejected"
                              data-id="${escapeHTML(
                                request.id
                              )}"
                              type="button"
                            >
                              Reject
                            </button>

                          </div>

                        `
                        : ""
                    }

                  </div>

                </article>

              `;

            }
          )
          .join("");


      /*
        APPROVE / REJECT
      */

      requests
        .querySelectorAll(
          "[data-status]"
        )
        .forEach(
          button => {


            button.onclick =
              async () => {


                const id =
                  button.dataset.id;


                const newStatus =
                  button.dataset.status;


                const actionText =
                  newStatus === "approved"
                    ? "approve"
                    : "reject";


                const confirmed =
                  confirm(
                    "Are you sure you want to " +
                    actionText +
                    " this withdrawal request?"
                  );


                if (
                  !confirmed
                ) {

                  return;

                }


                button.disabled =
                  true;


                button.textContent =
                  newStatus === "approved"
                    ? "Approving…"
                    : "Rejecting…";


                try {


                  const result =
                    await sb
                      .from(
                        "withdrawal_requests"
                      )
                      .update({
                        status:
                          newStatus
                      })
                      .eq(
                        "id",
                        id
                      );


                  if (
                    result.error
                  ) {

                    throw result.error;

                  }


                  showStatus(
                    "Withdrawal request marked as " +
                    newStatus +
                    ".",
                    "success"
                  );


                  await loadRequests();


                } catch (
                  error
                ) {


                  console.error(
                    "Admin withdrawal update error:",
                    error
                  );


                  showStatus(
                    "Could not update the withdrawal request.",
                    "error"
                  );


                  button.disabled =
                    false;


                  button.textContent =
                    newStatus === "approved"
                      ? "Approve"
                      : "Reject";

                }

              };

          }
        );

    }


    await loadRequests();


    /*
      REFRESH EVERY 15 SECONDS
    */

    setInterval(
      loadRequests,
      15000
    );


  } catch (
    error
  ) {


    console.error(
      "Admin withdrawals error:",
      error
    );


    requests.className =
      "empty";

    requests.textContent =
      "Unable to load the admin withdrawal panel.";


    showStatus(
      error.message ||
      "Something went wrong.",
      "error"
    );

  }


})();

</script>


</body>

</html>
