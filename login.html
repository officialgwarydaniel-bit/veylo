<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Veylo</title><link rel="stylesheet" href="styles.css"></head><body class="auth"><main><a class="brand" href="index.html"><span class="mark">V</span>veylo</a><section class="authcard"><span class="eyebrow">WELCOME BACK</span><h1>Log in to Veylo</h1><p>Access your account and dashboard.</p><form id="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn" type="submit">Log in →</button><div id="msg"></div></form><p>New to Veylo? <a href="signup.html">Create an account</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return;}location.href='dashboard.html';});</script></body></html>
