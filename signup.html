<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Veylo</title><link rel="stylesheet" href="styles.css"></head><body class="auth"><main><a class="brand" href="index.html"><span class="mark">V</span>veylo</a><section class="authcard"><span class="eyebrow">GET STARTED</span><h1>Create your Veylo account</h1><p>Your account will be saved securely in Veylo.</p><form id="form"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="8" required></label><button class="btn" type="submit">Create account →</button><div id="msg"></div></form><p>Already have an account? <a href="login.html">Log in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Creating account…';const full_name=name.value.trim(),emailValue=email.value.trim(),passwordValue=password.value;const {data,error}=await sb.auth.signUp({email:emailValue,password:passwordValue,options:{data:{full_name}}});if(error){msg.textContent=error.message;return;}if(data.user){const r=await sb.from('profiles').upsert({id:data.user.id,full_name,balance:0});if(r.error){msg.textContent='Account created, but profile setup failed: '+r.error.message;return;}}msg.textContent=data.session?'Account created! Redirecting…':'Account created. Check your email to confirm, then log in.';setTimeout(()=>location.href='login.html',1200);});</script></body></html>
