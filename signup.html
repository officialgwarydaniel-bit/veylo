<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account — Veylo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
<main>
<a class="brand" href="index.html"><span class="mark">V</span>veylo</a>
<section class="authcard">
<span class="eyebrow">GET STARTED</span>
<h1>Create your Veylo account</h1>
<p>Your account will be saved securely in Veylo.</p>

<form id="signup-form">
<label>Full name<input id="full-name" required type="text" autocomplete="name"></label>
<label>Email<input id="email" required type="email" autocomplete="email"></label>
<label>Password<input id="password" required type="password" minlength="8" autocomplete="new-password"></label>
<button id="submit-button" class="btn" type="submit">Create account →</button>
<div id="message" aria-live="polite"></div>
</form>

<p>Already have an account? <a href="login.html">Log in</a></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const client = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("signup-form");
const message = document.getElementById("message");
const button = document.getElementById("submit-button");

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const fullName = document.getElementById("full-name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Creating account…";
  message.textContent = "";

  try {
    const { data, error } = await client.auth.signUp({
      email,
      password,
      options: { data: { full_name: fullName } }
    });

    if (error) throw error;
    if (!data.user) throw new Error("Veylo could not create the account. Please try again.");

    message.textContent = data.session
      ? "Account created. Redirecting…"
      : "Account created. Check your email to confirm your account.";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
  } catch (error) {
    console.error(error);
    message.textContent = error.message || "Something went wrong. Please try again.";
    button.disabled = false;
    button.textContent = "Create account →";
  }
});
</script>
</body>
</html>
