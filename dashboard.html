<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Veylo</title><link rel="stylesheet" href="styles.css"></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="mark">V</span>veylo</a><button id="logout" class="btn ghost">Log out</button></nav></header><main class="dash"><span class="eyebrow">YOUR DASHBOARD</span><h1>Welcome, <span id="name">there</span>.</h1><div class="grid"><section class="dashcard"><small>AVAILABLE BALANCE</small><strong id="balance">$0.00</strong><p>Demo balance stored in your Veylo profile.</p></section><section class="dashcard"><small>ACCOUNT EMAIL</small><strong id="email">Loading…</strong><p>Your authenticated Veylo account.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);(async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return;}document.getElementById('email').textContent=user.email||'';document.getElementById('name').textContent=user.user_metadata?.full_name||'there';const {data:p,error}=await sb.from('profiles').select('balance,full_name').eq('id',user.id).single();if(!error&&p){document.getElementById('name').textContent=p.full_name||document.getElementById('name').textContent;document.getElementById('balance').textContent='$'+Number(p.balance||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}})();document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html';};</script></body></html>
