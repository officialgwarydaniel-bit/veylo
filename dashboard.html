  <meta charset="utf-8">

  >

  <meta
    name="theme-color"
    content="#0b0d0f"
  >

  <title>Veylo — Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {
      --bg: #0b0d0f;
      --surface: #14171a;
      --surface2: #191c20;
      --line: #292d31;
      --text: #f4f4f2;
      --muted: #9a9da0;

      --accent: #35d1ad;
      --accent2: #ffae32;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    body {
      padding-bottom: 94px;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .wrap {
      width: min(100%, 900px);
      margin: auto;

      padding:
        18px
        16px
        110px;
    }

    /* TOP */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin:
        5px 0
        22px;
    }

    .brand {
      font-size: 28px;
      font-weight: 850;

      letter-spacing: -1.2px;
    }

    .avatar {
      width: 42px;
      height: 42px;

      border:
        1px solid
        var(--line);

      border-radius: 50%;

      display: grid;
      place-items: center;

      background:
        var(--surface);

      font-weight: 800;
    }

    /* BALANCE CARD */

    .card {
      background:
        var(--surface);

      border:
        1px solid
        var(--line);

      border-radius: 28px;

      padding: 24px;

      min-height: 245px;
    }

    .cardtop {
      display: flex;

      justify-content:
        space-between;

      gap: 15px;
    }

    .eyebrow {
      font-size: 12px;

      letter-spacing: 1.4px;

      font-weight: 800;

      color:
        var(--muted);
    }

    #welcome {
      margin-top: 6px;

      font-weight: 650;
    }

    .balance {
      font-size: 43px;

      font-weight: 850;

      letter-spacing: -2px;

      margin:
        38px 0;
    }

    .balancehide {
      border:
        1px solid
        var(--line);

      background:
        var(--surface2);

      color:
        var(--text);

      border-radius: 18px;

      padding:
        9px 13px;
    }

    .cardbottom {
      border-top:
        1px solid
        var(--line);

      padding-top: 15px;

      display: flex;

      justify-content:
        space-between;

      color:
        var(--muted);

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 1px;
    }

    /* HEADINGS */

    h2 {
      font-size: 20px;

      margin:
        26px 2px
        12px;
    }

    /* QUICK ACTIONS */

    .actions {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;
    }

    .action {
      min-height: 116px;

      border:
        1px solid
        var(--line);

      border-radius: 22px;

      background:
        var(--surface);

      color:
        var(--text);

      font-weight: 700;
    }

    .action:active,
    .wide button:active {
      transform: scale(.98);
    }

    .ico {
      width: 44px;
      height: 44px;

      margin:
        0 auto
        10px;

      border-radius: 50%;

      display: grid;

      place-items: center;

      background:
        var(--surface2);

      color:
        var(--accent);

      font-size: 23px;
    }

    .orange .ico {
      color:
        var(--accent2);
    }

    /* WIDE BUTTONS */

    .wide {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 10px;
    }

    .wide button {
      min-height: 64px;

      border:
        1px solid
        var(--line);

      border-radius: 20px;

      background:
        var(--surface);

      color:
        var(--text);

      font-weight: 750;
    }

    /* ACTIVITY */

    .activity {
      border:
        1px solid
        var(--line);

      border-radius: 22px;

      background:
        var(--surface);

      overflow: hidden;
    }

    .head {
      padding: 16px;

      border-bottom:
        1px solid
        var(--line);

      font-weight: 800;
    }

    .empty {
      text-align: center;

      padding:
        30px 18px;

      color:
        var(--muted);
    }

    /* TRANSACTIONS */

    .transaction {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 15px;

      padding:
        15px 16px;

      border-bottom:
        1px solid
        var(--line);
    }

    .transaction:last-child {
      border-bottom: 0;
    }

    .transaction-left {
      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;
    }

    .transaction-icon {
      width: 42px;
      height: 42px;

      flex:
        0 0 42px;

      border-radius: 50%;

      background:
        var(--surface2);

      display: grid;

      place-items: center;

      color:
        var(--accent);

      font-size: 18px;

      font-weight: 800;
    }

    .transaction-name {
      font-weight: 750;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .transaction-date {
      margin-top: 4px;

      color:
        var(--muted);

      font-size: 12px;
    }

    .transaction-amount {
      flex-shrink: 0;

      font-weight: 800;
    }

    .transaction-amount.positive {
      color:
        var(--accent);
    }

    .transaction-amount.negative {
      color:
        var(--accent2);
    }

    /* LOGOUT */

    .logout {
      width: 100%;

      height: 48px;

      margin-top: 20px;

      border:
        1px solid
        var(--line);

      border-radius: 15px;

      background:
        transparent;

      color:
        var(--muted);
    }

    /* BOTTOM NAV */

    .nav {
      position: fixed;

      z-index: 10;

      left: 0;
      right: 0;
      bottom: 0;

      background:
        rgba(
          11,
          13,
          15,
          .97
        );

      border-top:
        1px solid
        var(--line);

      padding:
        9px
        15px
        calc(
          9px +
          env(
            safe-area-inset-bottom
          )
        );

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;
    }

    .nav button {
      border: 0;

      background:
        transparent;

      color:
        var(--muted);

      padding: 10px;

      border-radius: 17px;

      font-weight: 700;
    }

    .nav .active {
      background:
        var(--text);

      color:
        var(--bg);
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .actions {
        gap: 8px;
      }

      .action {
        min-height: 110px;

        font-size: 13px;
      }

      .balance {
        font-size: 39px;
      }

    }

    @media (max-width: 390px) {

      .action {
        min-height: 103px;
      }

      .ico {
        width: 40px;
        height: 40px;
      }

    }

  </style>

</head>


<body>

<script>


(async () => {


  try {


    /*
      LOAD SUPABASE CONFIG
    */

    const txt =
      await fetch(
        "supabase-config.js",
        {
          cache: "no-store"
        }
      ).then(
        response =>
          response.text()
      );


    const url =
      (
        txt.match(
          /SUPABASE_URL\s*=\s*["']([^"']+)["']/
        ) || []
      )[1];


    const key =
      (
        txt.match(
          /SUPABASE_PUBLISHABLE_KEY\s*=\s*["']([^"']+)["']/
        ) || []
      )[1];


    if (!url || !key) {

      console.error(
        "Veylo Supabase configuration not found."
      );

      return;

    }


    /*
      CREATE SUPABASE CLIENT
    */

    const sb =
      window.supabase.createClient(
        url,
        key
      );


    /*
      CHECK LOGIN
    */

    const {
      data: {
        user
      },
      error: userError
    } =
      await sb.auth.getUser();


    if (
      userError ||
      !user
    ) {

      location.href =
        "login.html";

      return;

    }


    /*
      USER NAME
    */

    const name =
      user.user_metadata?.full_name ||
      user.user_metadata?.name ||
      user.email?.split("@")[0] ||
      "there";


    document.getElementById(
      "welcome"
    ).textContent =
      "Welcome back, " +
      name;


    document.getElementById(
      "avatar"
    ).textContent =
      name
        .charAt(0)
        .toUpperCase();



    /*
      LOAD BALANCE
    */

    async function loadBalance() {


      try {


        const result =
          await sb
            .from("profiles")
            .select("balance")
            .eq(
              "id",
              user.id
            )
            .maybeSingle();


        if (
          result.error
        ) {

          console.error(
            "Balance error:",
            result.error
          );

          return;

        }


        if (
          result.data &&
          result.data.balance !== null &&
          result.data.balance !== undefined
        ) {


          const formatted =
            "$" +
            Number(
              result.data.balance
            ).toLocaleString(
              "en-US",
              {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              }
            );


          const balanceElement =
            document.getElementById(
              "balance"
            );


          balanceElement.textContent =
            formatted;


          balanceElement.dataset.real =
            formatted;

        }


      } catch (error) {


        console.log(
          "Balance not available yet.",
          error
        );


      }

    }


    await loadBalance();



    /*
      DATE FORMAT
    */

    function formatDate(
      dateString
    ) {


      if (!dateString) {
        return "Unknown date";
      }


      const date =
        new Date(
          dateString
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "Unknown date";

      }


      const now =
        new Date();


      const difference =
        now.getTime() -
        date.getTime();


      const minute =
        60 * 1000;


      const hour =
        60 * minute;


      const day =
        24 * hour;


      if (
        difference < minute
      ) {

        return "Just now";

      }


      if (
        difference < hour
      ) {


        const minutes =
          Math.floor(
            difference /
            minute
          );


        return (
          minutes +
          (
            minutes === 1
              ? " minute ago"
              : " minutes ago"
          )
        );

      }


      if (
        difference < day
      ) {


        const hours =
          Math.floor(
            difference /
            hour
          );


        return (
          hours +
          (
            hours === 1
              ? " hour ago"
              : " hours ago"
          )
        );

      }


      return date.toLocaleDateString(
        "en-US",
        {
          month: "short",
          day: "numeric",
          year: "numeric"
        }
      );

    }



    /*
      TRANSACTION ICON
    */

    function transactionIcon(
      type
    ) {


      const value =
        String(
          type || ""
        ).toLowerCase();


      if (
        value === "deposit" ||
        value === "add_money"
      ) {

        return "+";

      }


      if (
        value === "withdrawal" ||
        value === "withdraw"
      ) {

        return "↓";

      }


      if (
        value === "transfer"
      ) {

        return "⇄";

      }


      if (
        value === "receive"
      ) {

        return "↓";

      }


      return "•";

    }



    /*
      TRANSACTION NAME
    */

    function transactionName(
      transaction
    ) {


      if (
        transaction.description
      ) {

        return transaction.description;

      }


      const type =
        String(
          transaction.type || ""
        ).toLowerCase();


      if (
        type === "deposit"
      ) {

        return "Money added";

      }


      if (
        type === "withdrawal" ||
        type === "withdraw"
      ) {

        return "Withdrawal";

      }


      if (
        type === "transfer"
      ) {

        return "Transfer";

      }


      if (
        type === "receive"
      ) {

        return "Money received";

      }


      return "Transaction";

    }



    /*
      TRANSACTION AMOUNT
    */

    function transactionAmount(
      transaction
    ) {


      const amount =
        Number(
          transaction.amount || 0
        );


      const type =
        String(
          transaction.type || ""
        ).toLowerCase();


      const negative =
        type === "withdrawal" ||
        type === "withdraw" ||
        type === "transfer";


      const prefix =
        negative
          ? "−"
          : "+";


      return {

        text:
          prefix +
          "$" +
          Math.abs(
            amount
          ).toLocaleString(
            "en-US",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          ),

        negative

      };

    }



    /*
      ESCAPE DATABASE TEXT
    */

    function escapeHTML(
      value
    ) {


      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }



    /*
      TRANSACTION HTML
    */

    function transactionHTML(
      transaction
    ) {


      const amount =
        transactionAmount(
          transaction
        );


      const amountClass =
        amount.negative
          ? "negative"
          : "positive";


      return `

        <div class="transaction">

          <div class="transaction-left">

            <div class="transaction-icon">
              ${transactionIcon(
                transaction.type
              )}
            </div>


            <div>

              <div class="transaction-name">
                ${escapeHTML(
                  transactionName(
                    transaction
                  )
                )}
              </div>


              <div class="transaction-date">
                ${formatDate(
                  transaction.created_at
                )}
              </div>

            </div>

          </div>


          <div
            class="transaction-amount ${amountClass}"
          >
            ${amount.text}
          </div>

        </div>

      `;

    }



    /*
      LOAD TRANSACTIONS
    */

    async function loadTransactions() {


      const liveActivity =
        document.getElementById(
          "liveActivity"
        );


      const history =
        document.getElementById(
          "transactionHistory"
        );


      try {


        const result =
          await sb
            .from("transactions")
            .select(
              "id,type,amount,description,created_at"
            )
            .eq(
              "user_id",
              user.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            )
            .limit(20);


        if (
          result.error
        ) {

          throw result.error;

        }


        const transactions =
          result.data || [];


        /*
          NO TRANSACTIONS
        */

        if (
          transactions.length === 0
        ) {


          liveActivity.innerHTML = `

            <div class="empty">
              Your recent transactions will appear here.
            </div>

          `;


          history.innerHTML = `

            <div class="empty">
              No transactions yet.
            </div>

          `;


          return;

        }


        /*
          LIVE ACTIVITY
        */

        const latest =
          transactions.slice(
            0,
            5
          );


        liveActivity.innerHTML =
          latest
            .map(
              transactionHTML
            )
            .join("");


        /*
          HISTORY
        */

        history.innerHTML =
          transactions
            .map(
              transactionHTML
            )
            .join("");


      } catch (error) {


        console.error(
          "Transaction loading error:",
          error
        );


        liveActivity.innerHTML = `

          <div class="empty">
            Unable to load activity.
          </div>

        `;


        history.innerHTML = `

          <div class="empty">
            Unable to load transaction history.
          </div>

        `;

      }

    }


    await loadTransactions();


    /*
      REFRESH BALANCE + TRANSACTIONS
      EVERY 10 SECONDS
    */

    setInterval(
      async () => {

        await loadBalance();

        await loadTransactions();

      },
      10000
    );



    /*
      DASHBOARD BUTTONS
    */

    document
      .querySelectorAll(
        "[data-action]"
      )
      .forEach(
        button => {


          button.onclick =
            () => {


              const action =
                button.dataset.action;


              /*
                TRANSFER
              */

              if (
                action === "Transfer"
              ) {

                location.href =
                  "transfer.html";

                return;

              }


              /*
                ADD MONEY
              */

              if (
                action === "Add money"
              ) {

                location.href =
                  "add-money.html";

                return;

              }


              /*
                RECEIVE
              */

              if (
                action === "Receive"
              ) {

                location.href =
                  "receive.html";

                return;

              }


              /*
                HISTORY
              */

              if (
                action === "History"
              ) {

                location.href =
                  "history.html";

                return;

              }


              /*
                OTHER FEATURES
              */

              alert(
                action +
                " is coming soon."
              );

            };

        }
      );



    /*
      LOGOUT
    */

    document.getElementById(
      "logout"
    ).onclick =
      async () => {


        const {
          error
        } =
          await sb.auth.signOut();


        if (error) {

          console.error(
            "Logout error:",
            error
          );

          return;

        }


        location.href =
          "login.html";

      };



    /*
      HIDE / SHOW BALANCE
    */

    let shown =
      true;


    document.getElementById(
      "toggle"
    ).onclick =
      () => {


        const balance =
          document.getElementById(
            "balance"
          );


        const toggle =
          document.getElementById(
            "toggle"
          );


        shown =
          !shown;


        if (shown) {


          balance.textContent =
            balance.dataset.real ||
            "$0.00";


          toggle.textContent =
            "Hide";


        } else {


          if (
            !balance.dataset.real
          ) {

            balance.dataset.real =
              balance.textContent;

          }


          balance.textContent =
            "••••••";


          toggle.textContent =
            "Show";

        }

      };


  } catch (error) {


    console.error(
      "Veylo dashboard error:",
      error
    );


  }


})();

</script>

</html>
